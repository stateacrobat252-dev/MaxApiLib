[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "MaxApiLib"
version = "1.1.0"
description = "MaxApiLib — простые боты для мессенджера MAX: синхронная обёртка над maxapi без async и await — команды, кнопки, состояния, вебхуки, логи и мониторинг"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MaxApiLib contributors" }]
keywords = ["max", "maxapi", "bot", "messenger"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = ["maxapi>=1.2,<2"]

[project.optional-dependencies]
# Вебхуки работают на aiohttp — он и так приходит вместе с maxapi,
# extra нужен только если ставить библиотеку в нестандартном окружении.
webhook = ["aiohttp>=3.9,<4"]
dev = [
    "mypy>=1.11",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/stateacrobat252-dev/MaxApiLib"
Source = "https://github.com/stateacrobat252-dev/MaxApiLib"
Issues = "https://github.com/stateacrobat252-dev/MaxApiLib/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=maxapilib --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PTH"]
# Докстринги и сообщения на русском языке: буквы «с», «е», «о» — это
# кириллица, а не случайно набранные латинские символы.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true
